<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Shaik Khalil Basha</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .contact {
            max-width: 700px;
            margin: 50px auto;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .contact h2 {
            color: #0077cc;
            text-align: center;
        }

        .contact p {
            text-align: center;
            font-size: 17px;
        }

        form {
            margin-top: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 12px 30px;
            background-color: #0077cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #005fa3;
        }

        footer {
            text-align: center;
            background-color: #222;
            color: white;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Shaik Khalil Basha</h1>
        <p>Contact Me</p>
    </header>

    <section class="contact">

        <h2>Get In Touch</h2>

        <p>
            If you would like to contact me, please fill out the form below.
        </p>

        <form>

            <label for="name">Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject"
                   placeholder="Enter subject">

            <label for="message">Message</label>
            <textarea id="message" name="message"
                      placeholder="Enter your message" required></textarea>

            <button type="submit">Send Message</button>

        </form>

    </section>

    <footer>
        <p>&copy; 2026 Shaik Khalil Basha. All Rights Reserved.</p>
    </footer>

</body>
</html>
